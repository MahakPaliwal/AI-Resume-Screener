<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Screener</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #1a202c;
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            font-size: 1.1rem;
            color: #2d3748;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tab styles */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab {
            padding: 8px 20px;
            border-radius: 6px;
            border: 1.5px solid #cbd5e0;
            background: white;
            color: #718096;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab.active {
            background: #4299e1;
            color: white;
            border-color: #4299e1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .upload-area {
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .upload-area:hover {
            border-color: #4299e1;
        }

        .upload-area input {
            display: none;
        }

        .upload-area label {
            cursor: pointer;
            color: #4299e1;
            font-weight: 500;
        }

        .upload-area p {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .file-info {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #48bb78;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border: 1.5px solid #cbd5e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Segoe UI', sans-serif;
            resize: vertical;
            color: #2d3748;
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: #4299e1;
        }

        .char-count {
            font-size: 0.8rem;
            color: #a0aec0;
            text-align: right;
            margin-top: 6px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #3182ce;
        }

        .btn:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #718096;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #4299e1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            background: #fff5f5;
            border: 1px solid #fc8181;
            color: #c53030;
            padding: 16px;
            border-radius: 8px;
            display: none;
            margin-top: 16px;
        }

        .results {
            display: none;
        }

        .result-card {
            display: flex;
            align-items: center;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
        }

        .rank {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            margin-right: 16px;
            flex-shrink: 0;
        }

        .rank-1 {
            background: #ffd700;
            color: #744210;
        }

        .rank-2 {
            background: #c0c0c0;
            color: #2d3748;
        }

        .rank-3 {
            background: #cd7f32;
            color: white;
        }

        .rank-other {
            background: #e2e8f0;
            color: #4a5568;
        }

        .result-info {
            flex: 1;
        }

        .result-name {
            font-weight: 600;
            color: #2d3748;
        }

        .result-file {
            font-size: 0.8rem;
            color: #718096;
            margin-top: 2px;
        }

        .score-bar {
            width: 150px;
            text-align: right;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3748;
        }

        .bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #4299e1, #48bb78);
            transition: width 0.8s ease;
        }

        .summary {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }

        .summary-item {
            flex: 1;
            background: #ebf8ff;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .summary-item .number {
            font-size: 2rem;
            font-weight: 700;
            color: #2b6cb0;
        }

        .summary-item .label {
            font-size: 0.85rem;
            color: #4299e1;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 AI Resume Screener</h1>
        <p class="subtitle">Upload a Job Description and resumes to rank candidates by fit score</p>

        <!-- JD Section with tabs -->
        <div class="card">
            <h2>📄 Job Description</h2>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" onclick="switchTab('upload')">
                    📁 Upload PDF
                </button>
                <button class="tab" onclick="switchTab('paste')">
                    📝 Paste Text
                </button>
            </div>

            <!-- Upload tab -->
            <div class="tab-content active" id="tab-upload">
                <div class="upload-area">
                    <input type="file" id="jdFile" accept=".pdf">
                    <label for="jdFile">Click to upload JD (PDF)</label>
                    <p>Only PDF files supported</p>
                    <div class="file-info" id="jdInfo"></div>
                </div>
            </div>

            <!-- Paste tab -->
            <div class="tab-content" id="tab-paste">
                <textarea id="jdText"
                    placeholder="Paste your Job Description here...&#10;&#10;Example:&#10;We are looking for a Data Scientist with experience in Python, ML, NLP..."
                    oninput="updateCharCount(); checkReady();"></textarea>
                <div class="char-count">
                    <span id="charCount">0</span> characters
                </div>
            </div>
        </div>

        <!-- Resume Upload -->
        <div class="card">
            <h2>📋 Resumes</h2>
            <div class="upload-area">
                <input type="file" id="resumeFiles" accept=".pdf" multiple>
                <label for="resumeFiles">Click to upload Resumes (PDF)</label>
                <p>Select multiple files — hold Ctrl to select more than one</p>
                <div class="file-info" id="resumeInfo"></div>
            </div>
        </div>

        <!-- Submit Button -->
        <button class="btn" id="screenBtn" onclick="screenResumes()" disabled>
            Screen Resumes
        </button>

        <!-- Error -->
        <div class="error" id="error"></div>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing resumes... please wait</p>
        </div>

        <!-- Results -->
        <div class="results" id="results">
            <div class="card">
                <h2>🏆 Ranked Candidates</h2>
                <div class="summary" id="summary"></div>
                <div id="resultsList"></div>
            </div>
        </div>
    </div>

    <script>
        let activeTab = 'upload';

        const jdInput = document.getElementById('jdFile');
        const resumeInput = document.getElementById('resumeFiles');
        const screenBtn = document.getElementById('screenBtn');

        // Tab switching
        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            checkReady();
        }

        // File upload listeners
        jdInput.addEventListener('change', function () {
            if (this.files[0]) {
                document.getElementById('jdInfo').textContent = '✅ ' + this.files[0].name;
                checkReady();
            }
        });

        resumeInput.addEventListener('change', function () {
            if (this.files.length > 0) {
                document.getElementById('resumeInfo').textContent =
                    '✅ ' + this.files.length + ' resume(s) selected';
                checkReady();
            }
        });

        // Character counter
        function updateCharCount() {
            const count = document.getElementById('jdText').value.length;
            document.getElementById('charCount').textContent = count;
        }

        // Check if form is ready
        function checkReady() {
            const resumesReady = resumeInput.files.length > 0;
            let jdReady = false;

            if (activeTab === 'upload') {
                jdReady = jdInput.files.length > 0;
            } else {
                jdReady = document.getElementById('jdText').value.trim().length > 50;
            }

            screenBtn.disabled = !(jdReady && resumesReady);
        }

        // Main screen function
        async function screenResumes() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            screenBtn.disabled = true;

            const formData = new FormData();

            // Add JD — either PDF or text
            if (activeTab === 'upload') {
                formData.append('jd', jdInput.files[0]);
            } else {
                // Convert pasted text to a text file blob
                const jdText = document.getElementById('jdText').value;
                const blob = new Blob([jdText], { type: 'text/plain' });
                formData.append('jd', blob, 'job_description.txt');
            }

            // Add resumes
            for (let file of resumeInput.files) {
                formData.append('resumes', file);
            }

            try {
                const response = await fetch('http://localhost:8080/screen', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    showError(data.error);
                } else {
                    showResults(data);
                }
            } catch (err) {
                showError('Could not connect to server. Make sure Spring Boot is running on port 8080.');
            } finally {
                document.getElementById('loading').style.display = 'none';
                screenBtn.disabled = false;
            }
        }
        function showResults(data) {
            const topScore = data.ranked_candidates[0]?.match_score || 0;
            document.getElementById('summary').innerHTML = `
        <div class="summary-item">
            <div class="number">${data.total_resumes}</div>
            <div class="label">Resumes Analyzed</div>
        </div>
        <div class="summary-item">
            <div class="number">${topScore}%</div>
            <div class="label">Top Match Score</div>
        </div>
        <div class="summary-item">
            <div class="number">${data.jd_keywords_found.length}</div>
            <div class="label">JD Keywords Found</div>
        </div>
    `;

            const list = document.getElementById('resultsList');
            list.innerHTML = data.ranked_candidates.map(candidate => `
        <div class="result-card" style="flex-direction: column; align-items: stretch;">

            <!-- Header row -->
            <div style="display:flex; align-items:center; margin-bottom:12px;">
                <div class="rank rank-${candidate.rank <= 3 ? candidate.rank : 'other'}">
                    ${candidate.rank}
                </div>
                <div class="result-info">
                    <div class="result-name">Candidate ${candidate.rank}</div>
                    <div class="result-file">${candidate.filename}</div>
                </div>
                <div class="score-bar">
                    <div class="score-value">${candidate.match_score}%</div>
                    <div style="font-size:0.75rem; color:#718096;">Semantic Match</div>
                    <div class="bar">
                        <div class="bar-fill" style="width:${candidate.match_score}%"></div>
                    </div>
                </div>
            </div>

            <!-- Keyword match bar -->
            <div style="margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:#4a5568; margin-bottom:4px;">
                    <span>Keyword Match</span>
                    <span style="font-weight:600;">${candidate.keyword_match_percent}%</span>
                </div>
                <div class="bar">
                    <div class="bar-fill" style="width:${candidate.keyword_match_percent}%; background: linear-gradient(90deg, #ed8936, #ecc94b);"></div>
                </div>
            </div>

            <!-- Matched keywords -->
            <div style="margin-bottom:10px;">
                <div style="font-size:0.8rem; font-weight:600; color:#276749; margin-bottom:6px;">
                    ✅ Matched Keywords (${candidate.matched_keywords.length})
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    ${candidate.matched_keywords.length > 0
                    ? candidate.matched_keywords.map(k => `
                            <span style="background:#c6f6d5; color:#276749; padding:3px 10px; border-radius:20px; font-size:0.78rem;">
                                ${k}
                            </span>`).join('')
                    : '<span style="color:#a0aec0; font-size:0.8rem;">None found</span>'
                }
                </div>
            </div>

            <!-- Missing keywords / Skills gap -->
            <div style="margin-bottom:10px;">
                <div style="font-size:0.8rem; font-weight:600; color:#c53030; margin-bottom:6px;">
                    ❌ Skills Gap (${candidate.missing_keywords.length} missing)
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    ${candidate.missing_keywords.length > 0
                    ? candidate.missing_keywords.map(k => `
                            <span style="background:#fff5f5; color:#c53030; padding:3px 10px; border-radius:20px; font-size:0.78rem; border:1px solid #fc8181;">
                                ${k}
                            </span>`).join('')
                    : '<span style="color:#48bb78; font-size:0.8rem;">No skill gaps!</span>'
                }
                </div>
            </div>

            <!-- Extra skills -->
            ${candidate.extra_skills.length > 0 ? `
            <div>
                <div style="font-size:0.8rem; font-weight:600; color:#2b6cb0; margin-bottom:6px;">
                    ⭐ Additional Skills (${candidate.extra_skills.length})
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    ${candidate.extra_skills.slice(0, 8).map(k => `
                        <span style="background:#ebf8ff; color:#2b6cb0; padding:3px 10px; border-radius:20px; font-size:0.78rem;">
                            ${k}
                        </span>`).join('')}
                </div>
            </div>` : ''}

        </div>
    `).join('');

            document.getElementById('results').style.display = 'block';
        }
        function showResults(data) {
            const topScore = data.ranked_candidates[0]?.match_score || 0;
            document.getElementById('summary').innerHTML = `
        <div class="summary-item">
            <div class="number">${data.total_resumes}</div>
            <div class="label">Resumes Analyzed</div>
        </div>
        <div class="summary-item">
            <div class="number">${topScore}%</div>
            <div class="label">Top Match Score</div>
        </div>
        <div class="summary-item">
            <div class="number">${data.jd_keywords_found.length}</div>
            <div class="label">JD Keywords Found</div>
        </div>
    `;

            const list = document.getElementById('resultsList');
            list.innerHTML = data.ranked_candidates.map(candidate => `
        <div class="result-card" style="flex-direction: column; align-items: stretch;">

            <!-- Header row -->
            <div style="display:flex; align-items:center; margin-bottom:12px;">
                <div class="rank rank-${candidate.rank <= 3 ? candidate.rank : 'other'}">
                    ${candidate.rank}
                </div>
                <div class="result-info">
                    <div class="result-name">Candidate ${candidate.rank}</div>
                    <div class="result-file">${candidate.filename}</div>
                </div>
                <div class="score-bar">
                    <div class="score-value">${candidate.match_score}%</div>
                    <div style="font-size:0.75rem; color:#718096;">Semantic Match</div>
                    <div class="bar">
                        <div class="bar-fill" style="width:${candidate.match_score}%"></div>
                    </div>
                </div>
            </div>

            <!-- Keyword match bar -->
            <div style="margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:#4a5568; margin-bottom:4px;">
                    <span>Keyword Match</span>
                    <span style="font-weight:600;">${candidate.keyword_match_percent}%</span>
                </div>
                <div class="bar">
                    <div class="bar-fill" style="width:${candidate.keyword_match_percent}%; background: linear-gradient(90deg, #ed8936, #ecc94b);"></div>
                </div>
            </div>

            <!-- Matched keywords -->
            <div style="margin-bottom:10px;">
                <div style="font-size:0.8rem; font-weight:600; color:#276749; margin-bottom:6px;">
                    ✅ Matched Keywords (${candidate.matched_keywords.length})
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    ${candidate.matched_keywords.length > 0
                    ? candidate.matched_keywords.map(k => `
                            <span style="background:#c6f6d5; color:#276749; padding:3px 10px; border-radius:20px; font-size:0.78rem;">
                                ${k}
                            </span>`).join('')
                    : '<span style="color:#a0aec0; font-size:0.8rem;">None found</span>'
                }
                </div>
            </div>

            <!-- Missing keywords / Skills gap -->
            <div style="margin-bottom:10px;">
                <div style="font-size:0.8rem; font-weight:600; color:#c53030; margin-bottom:6px;">
                    ❌ Skills Gap (${candidate.missing_keywords.length} missing)
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    ${candidate.missing_keywords.length > 0
                    ? candidate.missing_keywords.map(k => `
                            <span style="background:#fff5f5; color:#c53030; padding:3px 10px; border-radius:20px; font-size:0.78rem; border:1px solid #fc8181;">
                                ${k}
                            </span>`).join('')
                    : '<span style="color:#48bb78; font-size:0.8rem;">No skill gaps!</span>'
                }
                </div>
            </div>

            <!-- Extra skills -->
            ${candidate.extra_skills.length > 0 ? `
            <div>
                <div style="font-size:0.8rem; font-weight:600; color:#2b6cb0; margin-bottom:6px;">
                    ⭐ Additional Skills (${candidate.extra_skills.length})
                </div>
                <div style="display:flex; flex-wrap:wrap; gap:6px;">
                    ${candidate.extra_skills.slice(0, 8).map(k => `
                        <span style="background:#ebf8ff; color:#2b6cb0; padding:3px 10px; border-radius:20px; font-size:0.78rem;">
                            ${k}
                        </span>`).join('')}
                </div>
            </div>` : ''}

        </div>
    `).join('');

            document.getElementById('results').style.display = 'block';
        }

        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.style.display = 'block';
        }
    </script>
</body>

</html>
